<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostica QR</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    margin:40px;
    background:#f4f4f4;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

pre{
    background:#eee;
    padding:15px;
    overflow:auto;
    border-radius:5px;
}
.ok{
    color:green;
    font-weight:bold;
}
.no{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h2>Diagnostica QR</h2>

<div id="risultato"></div>

<pre id="log"></pre>

</div>

<script>

const form = [

{
start:"2026-08-01",
end:"2026-08-05",
url:"https://docs.google.com/forms/d/e/1FAIpQLSdZH_Q-Ft5PhVgy95fDIDs2e0YxlO3np4BIZ5N6p3ZjIBNeRA/viewform?usp=publish-editor",
msg:"Apertura del modulo 1..."
},

{
start:"2026-08-11",
end:"2026-08-15",
url:"https://docs.google.com/forms/d/e/1FAIpQLScy4cjhEY0q-Bzs0599xkjnJ5vKiw3HoAb4SxQf3m9y9K7j4g/viewform?usp=publish-editor",
msg:"Apertura del modulo 2..."
},

{
start:"2026-08-21",
end:"2026-08-25",
url:"https://docs.google.com/forms/d/e/1FAIpQLSeIndw6mSUYZFVwjtKsXfuEHutSiJiqUHJ4FVZMaOQqpcbYdQ/viewform?usp=publish-editor",
msg:"Apertura del modulo 3..."
},

{
start:"2026-09-01",
end:"2026-09-05",
url:"https://docs.google.com/forms/d/e/1FAIpQLSe6JZA_OjGmS8NknsQ5B4UMm1QYIBtq9nfEphPHA7pKyOK1WQ/viewform?usp=publish-editor",
msg:"Apertura del modulo 4..."
}

];

function parseData(s){

const p=s.split("-");

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2]),
0,0,0,0
);

}

const oggi=new Date();

oggi.setHours(0,0,0,0);

let testo="";

testo+="Oggi: "+oggi.toString()+"\n\n";

let trovato=false;

for(const f of form){

const inizio=parseData(f.start);

const fine=parseData(f.end);

fine.setHours(23,59,59,999);

const valido=oggi>=inizio && oggi<=fine;

testo+="----------------------\n";
testo+="Intervallo\n";
testo+="Dal : "+inizio.toString()+"\n";
testo+="Al  : "+fine.toString()+"\n";
testo+="URL : "+f.url+"\n";
testo+="Esito: "+valido+"\n\n";

if(valido){

trovato=true;

document.getElementById("risultato").innerHTML=
'<p class="ok">INTERVALLO TROVATO</p>'+
'<p>'+f.msg+'</p>'+
'<p>'+f.url+'</p>';

/* togli il commento per il redirect */

setTimeout(()=>{
    location.href=f.url;
},1000);

break;

}

}

if(!trovato){

document.getElementById("risultato").innerHTML=
'<p class="no">NESSUN INTERVALLO TROVATO</p>';

}

document.getElementById("log").textContent=testo;

</script>

</body>
</html>
