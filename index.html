<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reindirizzamento...</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.15);
    text-align:center;
    max-width:500px;
}

h2{
    color:#1a73e8;
}

p{
    color:#555;
}

</style>

</head>

<body>

<div class="card">

<h2 id="titolo">Controllo della disponibilità...</h2>

<p id="testo">Attendere qualche istante...</p>

</div>

<script>

const form = [

{
start:"2026-09-26",
end:"2026-10-03",
url:"https://docs.google.com/forms/u/0/d/1k4J8lBO1EoO8sdOA1O5LLwCOssbTlpi-Z4DrGhfhug0/viewform?usp=drivesdk&edit_requested=true",
msg:"Apertura del modulo<br>\"Primo incontro 'Apericena a 3' - 2026/27\"..."
},

{
start:"2026-11-21",
end:"2026-11-28",
url:"https://docs.google.com/forms/d/1MJnIHiJ0kqPFeADLnEX2XygVA_E99y1jRB5LpEU-X3Q/viewform?edit_requested=true",
msg:"Apertura del modulo<br>\"Secondo incontro 'Apericena a 3' - 2026/27\"..."
},

{
start:"2027-01-09",
end:"2027-01-16",
url:"https://docs.google.com/forms/d/1EgMvqgE8vCgjApayjGRXQ0UaM7R3glOfWq8SKCl26gc/viewform?edit_requested=true",
msg:"Apertura del modulo<br>\"Terzo incontro 'Apericena a 3' - 2026/27\"..."
},

{
start:"2027-02-20",
end:"2027-02-27",
url:"https://docs.google.com/forms/d/1PLEX7559NJCs45FvJQHwkEoBp_S2rd9NHZSxcN6rgeQ/viewform?edit_requested=true",
msg:"Apertura del modulo<br>\"Quarto incontro 'Apericena a 3' - 2026/27\"..."
}

];

function parseData(data){

    const [anno,mese,giorno] = data.split("-").map(Number);

    return new Date(anno,mese-1,giorno,0,0,0,0);

}

const oggi = new Date();
oggi.setHours(0,0,0,0);

let trovato = false;

for(const f of form){

    const inizio = parseData(f.start);
    const fine = parseData(f.end);

    fine.setHours(23,59,59,999);

    if(oggi >= inizio && oggi <= fine){

        document.getElementById("titolo").innerHTML = f.msg;
        document.getElementById("testo").textContent = "Reindirizzamento in corso...";

        trovato = true;

        setTimeout(function(){

            window.location.replace(f.url);

        },500);

        break;

    }

}

if(!trovato){

    document.getElementById("titolo").textContent="Modulo non disponibile";

    document.getElementById("testo").innerHTML=
        "Non è possibile registrarsi ora agli incontri 'Apericena a 3' - 2026/27." + "<br><br>" + "Le registrazioni si apriranno la settimana prima dell'evento." + "<br><br>" + "Un caro saluto dallo staff!" + "<br><br>" + "Per info: apericena3.mi1@gmail.com";

}

</script>

</body>
</html>
