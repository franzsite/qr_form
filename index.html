<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reindirizzamento...</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.15);
    text-align:center;
    max-width:500px;
}

h2{
    color:#1a73e8;
}

p{
    color:#555;
}

</style>

</head>

<body>

<div class="card">

<h2 id="titolo">Controllo della disponibilità...</h2>

<p id="testo">Attendere qualche istante...</p>

</div>

<script>

const form = [

{
start:"2026-08-01",
end:"2026-08-05",
url:"https://docs.google.com/forms/d/e/1FAIpQLSdZH_Q-Ft5PhVgy95fDIDs2e0YxlO3np4BIZ5N6p3ZjIBNeRA/viewform?usp=publish-editor",
msg:"Apertura del modulo 1..."
},

{
start:"2026-08-11",
end:"2026-08-15",
url:"https://docs.google.com/forms/d/e/1FAIpQLScy4cjhEY0q-Bzs0599xkjnJ5vKiw3HoAb4SxQf3m9y9K7j4g/viewform?usp=publish-editor",
msg:"Apertura del modulo 2..."
},

{
start:"2026-08-21",
end:"2026-08-25",
url:"https://docs.google.com/forms/d/e/1FAIpQLSeIndw6mSUYZFVwjtKsXfuEHutSiJiqUHJ4FVZMaOQqpcbYdQ/viewform?usp=publish-editor",
msg:"Apertura del modulo 3..."
},

{
start:"2026-09-01",
end:"2026-09-05",
url:"https://docs.google.com/forms/d/e/1FAIpQLSe6JZA_OjGmS8NknsQ5B4UMm1QYIBtq9nfEphPHA7pKyOK1WQ/viewform?usp=publish-editor",
msg:"Apertura del modulo 4..."
}

];

function parseData(data){

    const [anno,mese,giorno] = data.split("-").map(Number);

    return new Date(anno,mese-1,giorno,0,0,0,0);

}

const oggi = new Date();
oggi.setHours(0,0,0,0);

let trovato = false;

for(const f of form){

    const inizio = parseData(f.start);
    const fine = parseData(f.end);

    fine.setHours(23,59,59,999);

    if(oggi >= inizio && oggi <= fine){

        document.getElementById("titolo").textContent = f.msg;
        document.getElementById("testo").textContent = "Reindirizzamento in corso...";

        trovato = true;

        setTimeout(function(){

            window.location.replace(f.url);

        },500);

        break;

    }

}

if(!trovato){

    document.getElementById("titolo").textContent="Modulo non disponibile";

    document.getElementById("testo").textContent=
        "In questo momento non è attivo alcun Google Form.";

}

</script>

</body>
</html>
